name: Build and Test on Linux

on:
  push:
  pull_request:

jobs:
  build-linux:
    name: py${{ matrix.python-version }}_cc=${{ matrix.ccompiler }}_static=${{ matrix.staticlib }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        ccompiler: ["gcc"]
        staticlib: ["False"]

    env:
      CC: ${{ matrix.ccompiler }}
      LIBTDLPACK_VERSION: "1.0.0"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install Ubuntu dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            gfortran \
            wget

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          if [ -f requirements.txt ]; then
            python -m pip install -r requirements.txt
          fi
          python -m pip install pytest

      - name: Install libtdlpack
        run: |
          echo "Installing libtdlpack version ${LIBTDLPACK_VERSION}"
          wget https://github.com/NOAA-MDL/libtdlpack/archive/refs/tags/v${LIBTDLPACK_VERSION}.tar.gz
          tar -xzf v${LIBTDLPACK_VERSION}.tar.gz

          cmake -S libtdlpack-${LIBTDLPACK_VERSION} -B libtdlpack-${LIBTDLPACK_VERSION}/build \
            -DUSE_OPENMP=ON \
            -DBUILD_SHARED_LIBS=ON \
            -DCMAKE_BUILD_TYPE=Release

          cmake --build libtdlpack-${LIBTDLPACK_VERSION}/build --parallel
          sudo cmake --install libtdlpack-${LIBTDLPACK_VERSION}/build
          sudo ldconfig

      - name: Install tdlpackio
        run: |
          python --version
          USE_STATIC_LIBS=${{ matrix.staticlib }} python -m pip install .

      - name: Show tdlpackio configuration
        run: |
          python -c "import tdlpackio; tdlpackio.show_config()"

      - name: Run tests
        run: |
          pytest -v tests/
