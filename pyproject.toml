[build-system]
requires = [
  "cython>3",
  "numpy",
  "scikit-build-core>=1.0",
]
build-backend = "scikit_build_core.build"

[project]
name = "tdlpackio"
dynamic = ["version"]
description = "Python interface for reading and writing TDLPACK data"
authors = [
  {name = "Eric Engle", email = "eric.engle@noaa.gov"},
]
requires-python = ">=3.8,<3.15"
keywords = [
  "atmospheric-science",
  "data-science",
  "meteorology",
  "mos",
  "numpy",
  "statistics",
  "statpp",
  "weather",
  "weather-data"
]
readme = "README.md"
license = {text = "MIT"}
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Console",
  "Programming Language :: Cython",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Topic :: Scientific/Engineering :: Atmospheric Science",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Operating System :: POSIX",
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS",
]
dependencies = [
  "numpy",
] 

[[tool.dynamic-metadata]]
provider = "scikit_build_core.metadata.regex"
field = "version"
input = "VERSION"
regex = '^(?P<value>\S+)\s*$'

[project.optional-dependencies]
xarray = ["xarray"]

[project.entry-points."xarray.backends"]
tdlpackio = "tdlpackio.xarray_backend:TdlpackBackendEntrypoint"

[project.scripts]
lstdlp = "tdlpackio:lstdlp._lstdlp_main"

[project.urls]
Documentation = "https://noaa-mdl.github.io/tdlpackio"
Respository = "https://github.com/NOAA-MDL/tdlpackio"

[tool.scikit-build]
minimum-version = "build-system.requires"
cmake.version = ">=3.18"
wheel.packages = ["src/tdlpackio"]
logging.level = "INFO"

# Include only the files and directories explicitly selected below.
sdist.inclusion-mode = "explicit"

# Equivalent to the include and graft directives from MANIFEST.in.
sdist.include = [
  "MANIFEST.in",
  "setup.py",
  "pyproject.toml",
  "README.md",
  "LICENSE",
  "VERSION",
  "create_docs.sh",
  "requirements.txt",

  # Files required by the CMake source build.
  "CMakeLists.txt",
  "cmake/**",

  # Equivalent to the MANIFEST.in graft directives.
  "docs/**",
  "src/ext/**",
  "src/tdlpackio/**",
]

# Equivalent to the prune and global-exclude directives from MANIFEST.in.
sdist.exclude = [
  "tests/**",
  "*.py[cod]",
  "*.c",
  "*.so",
  "*.DS_Store",
]

[tool.ruff]
line-length = 150
extend-exclude = [
    "build",
    "dist",
    "demos",
    "tests/OLD-*.py",
]

[tool.ruff.lint]
ignore = [
    "D",    # Ignore all docstring-related rules (D prefix)
    "F541", # Ignore f-string without any placeholders
    "F401", # Ignore unused imports
    "F403", # Ignore unable to detect undefined names
    "F405", # Ignore undefined, or defined from star imports
    "F811", # Ignore redefinition
]
select = ["E4", "E7", "E9", "F"] # preserve ruff < 0.16.0 rules
